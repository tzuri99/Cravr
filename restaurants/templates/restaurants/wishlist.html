<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #6c757d;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover { text-decoration: underline; }

        h1 { margin-top: 0; font-size: 24px; }

        .wishlist-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            margin-bottom: 12px;
            background-color: #fff;
        }

        .restaurant-info strong { display: block; font-size: 16px; color: #212529; }
        .restaurant-info span { font-size: 13px; color: #6c757d; }

        .btn-remove {
            color: #e03131;
            background-color: #fff5f5;
            padding: 8px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            transition: background 0.2s;
        }

        .btn-remove:hover { background-color: #ffe3e3; }

        .empty-state { text-align: center; color: #868e96; padding: 40px 0; }
    </style>
</head>
<body>

<div class="container">
    <a href="{% url 'restaurant_list' %}" class="back-link">← Back to Restaurants</a>
    
    <h1>❤️ My Wishlist</h1>

    {% if wishlist_items %}
        {% for item in wishlist_items %}
            <div class="wishlist-item">
                <div class="restaurant-info">
                    <strong>{{ item.restaurant.name }}</strong>
                    <span>📍 {{ item.restaurant.address|default:"No address provided" }}</span>
                </div>
                <a href="{% url 'toggle_wishlist' item.restaurant.id %}" class="btn-remove">Remove</a>
            </div>
        {% endfor %}
    {% else %}
        <div class="empty-state">
            <p>Your wishlist is currently empty.</p>
            <a href="{% url 'restaurant_list' %}">Explore restaurants to bookmark!</a>
        </div>
    {% endif %}
</div>

</body>
</html>
