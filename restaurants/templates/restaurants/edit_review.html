<!DOCTYPE html>
<html>
<head>
    <title>Edit review</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <h1 class="edit-review-title">
    Edit your review of {{ review.restaurant.name }}
   </h1>

    <form method="post" class="edit-review-form">
        {% csrf_token %}
        <p>
            <label>Stars:</label><br>
            {{ form.stars }}
        </p>
        <p>
            <label>Your review:</label><br>
            {{ form.text }}
        </p>
        <button type="submit" class="edit-review-save">
    Save
       </button>
        <a href="{% url 'restaurant_detail' review.restaurant.pk %}" class="edit-review-cancel">
    Cancel
        </a>
    </form>
</body>
</html>
