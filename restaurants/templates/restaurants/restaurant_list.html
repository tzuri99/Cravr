<!DOCTYPE html>
<html>
<head>
    <title>Restaurants</title>
</head>
<body>
    <h1>Restaurants</h1>
    <a href="{% url 'add_restaurant' %}">Add a restaurant</a>

    <ul>
        {% for restaurant in restaurants %}
            <li>{{ restaurant.name }} ({{ restaurant.cuisine }})</li>
        {% empty %}
            <li>No restaurants yet.</li>
        {% endfor %}
    </ul>
</body>
</html>
