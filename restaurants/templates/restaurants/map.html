{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Map</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

    <style>
        body {
            margin: 0;
            background: #fff8ef;
        }

        .map-page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 20px;
        }

        .map-card {
            background: white;
            border-radius: 22px;
            padding: 28px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
        }

        .back-link {
            display: inline-block;
            margin-bottom: 24px;
            color: #27b5ad;
            text-decoration: none;
            font-size: 15px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .map-heading {
            margin-bottom: 20px;
        }

        .map-heading h1 {
            margin: 0;
            font-size: 28px;
            color: #2d2d2d;
        }

        .map-heading p {
            margin: 8px 0 0;
            color: #777;
            font-size: 15px;
        }

        .map-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .map-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 14px;
            color: #666;
        }

        .legend-green {
            color: #45b649;
        }

        .legend-orange {
            color: #f4a62a;
        }

        .legend-red {
            color: #e95454;
        }

        .legend-grey {
            color: #999;
        }

        .find-location-btn {
            border: none;
            background: #ff6b57;
            color: white;
            padding: 11px 18px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .find-location-btn:hover {
            background: #f35c49;
        }

        #map {
            width: 100%;
            height: 600px;
            border-radius: 16px;
            overflow: hidden;
        }

        @media (max-width: 700px) {
            .map-page {
                padding: 14px;
            }

            .map-card {
                padding: 20px;
                border-radius: 18px;
            }

            .map-controls {
                align-items: stretch;
            }

            .find-location-btn {
                width: 100%;
            }

            #map {
                height: 500px;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="/" class="brand">Cravr</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="{% url 'search_users' %}">Search Users</a>
            <a href="{% url 'profile' %}">My Profile</a>
            <a href="{% url 'logout' %}" class="nav-cta">Logout</a>
        </div>
    </nav>

<div class="map-page">
    <div class="map-card">

        <a href="{% url 'restaurant_list' %}" class="back-link">
            ← Back to Restaurants
        </a>

        <div class="map-heading">
            <h1>Restaurant Map</h1>
            <p>Browse nearby restaurants and choose where to eat next!</p>
        </div>

        <div class="map-controls">
            <div class="map-legend">
                <span class="legend-green">● 4+ stars</span>
                <span class="legend-orange">● 3–4 stars</span>
                <span class="legend-red">● Below 3</span>
                <span class="legend-grey">● No reviews</span>
            </div>

            <button id="find-me" class="find-location-btn">
                Find my location
            </button>
        </div>

        <div id="map"></div>

        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

        <script>
            const params = new URLSearchParams(window.location.search);

            const targetRestaurantId = params.get("restaurant");
            const targetLat = parseFloat(params.get("lat"));
            const targetLng = parseFloat(params.get("lng"));

            const hasTargetRestaurant =
                targetRestaurantId &&
                !isNaN(targetLat) &&
                !isNaN(targetLng);

            const map = L.map("map");

            if (hasTargetRestaurant) {
                map.setView(
                    [targetLat, targetLng],
                    17
                );
            } else {
                map.setView(
                    [3.14, 101.70],
                    13
                );
            }

            L.tileLayer(
                "https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png",
                {
                    attribution:
                        "© OpenStreetMap France | © OpenStreetMap contributors",
                    maxZoom: 20,
                }
            ).addTo(map);

            const markerCluster = L.markerClusterGroup();

            let userPosition = null;

            /*
            * Only automatically move to the user's position
            * when the page was NOT opened for a specific restaurant.
            *
            * Otherwise geolocation would override the restaurant
            * we are trying to focus on.
            */
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function (position) {
                        userPosition = [
                            position.coords.latitude,
                            position.coords.longitude
                        ];

                        L.marker(userPosition)
                            .addTo(map)
                            .bindPopup("You are here");

                        if (!hasTargetRestaurant) {
                            map.setView(
                                userPosition,
                                15
                            );
                        }
                    }
                );
            }

            function iconColorFor(rating) {
                if (
                    rating === null ||
                    rating === undefined
                ) {
                    return "grey";
                }

                if (rating < 3) {
                    return "red";
                }

                if (rating < 4) {
                    return "orange";
                }

                return "green";
            }

            function coloredIcon(color) {
                return new L.Icon({
                    iconUrl:
                        "https://cdn.jsdelivr.net/gh/pointhi/leaflet-color-markers@master/img/marker-icon-2x-" +
                        color +
                        ".png",

                    shadowUrl:
                        "https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png",

                    iconSize: [25, 41],
                    iconAnchor: [12, 41],
                    popupAnchor: [1, -34],
                    shadowSize: [41, 41],
                });
            }

            const detailUrlBase =
                "{% url 'restaurant_detail' 0 %}".slice(0, -2);

            let targetHasBeenFocused = false;

            function loadRestaurants() {
                markerCluster.clearLayers();

                const bounds = map.getBounds();

                const url =
                    "{% url 'restaurants_json' %}" +
                    "?south=" + bounds.getSouth() +
                    "&west=" + bounds.getWest() +
                    "&north=" + bounds.getNorth() +
                    "&east=" + bounds.getEast();

                fetch(url)
                    .then(function (response) {
                        return response.json();
                    })
                    .then(function (restaurants) {
                        let targetMarker = null;

                        restaurants.forEach(function (r) {
                            const directionsUrl =
                                "https://www.google.com/maps/dir/?api=1&destination=" +
                                r.latitude +
                                "," +
                                r.longitude;

                            const ratingText = r.avg_rating
                                ? "★ " +
                                r.avg_rating +
                                " (" +
                                r.review_count +
                                " review" +
                                (r.review_count === 1 ? "" : "s") +
                                ")"
                                : "No reviews yet";

                            const popup =
                                "<strong>" +
                                r.name +
                                "</strong><br>" +

                                (r.cuisine || "") +
                                "<br>" +

                                ratingText +
                                "<br>" +

                                (r.address || "") +
                                "<br>" +

                                '<a href="' +
                                detailUrlBase +
                                r.id +
                                '/">See details</a>' +

                                '<br><a href="' +
                                directionsUrl +
                                '" target="_blank">Get directions</a>';

                            const icon = coloredIcon(
                                iconColorFor(r.avg_rating)
                            );

                            const marker = L.marker(
                                [
                                    r.latitude,
                                    r.longitude
                                ],
                                {
                                    icon: icon
                                }
                            );

                            marker.bindPopup(popup);

                            markerCluster.addLayer(marker);

                            /*
                            * Remember the marker belonging to
                            * the restaurant requested from
                            * the detail page.
                            */
                            if (
                                targetRestaurantId &&
                                String(r.id) ===
                                    String(targetRestaurantId)
                            ) {
                                targetMarker = marker;
                            }
                        });

                        map.addLayer(markerCluster);

                        /*
                        * If this map page was opened from a
                        * restaurant detail page, reveal the
                        * restaurant even if its marker is
                        * currently inside a cluster.
                        */
                        if (
                            targetMarker &&
                            !targetHasBeenFocused
                        ) {
                            targetHasBeenFocused = true;

                            markerCluster.zoomToShowLayer(
                                targetMarker,
                                function () {
                                    targetMarker.openPopup();
                                }
                            );
                        }
                    });
            }

            loadRestaurants();

            map.on(
                "moveend",
                loadRestaurants
            );

            document
                .getElementById("find-me")
                .addEventListener(
                    "click",
                    function () {
                        if (userPosition) {
                            map.setView(
                                userPosition,
                                15
                            );
                        } else if (
                            navigator.geolocation
                        ) {
                            navigator.geolocation.getCurrentPosition(
                                function (position) {
                                    userPosition = [
                                        position.coords.latitude,
                                        position.coords.longitude
                                    ];

                                    L.marker(userPosition)
                                        .addTo(map)
                                        .bindPopup("You are here")
                                        .openPopup();

                                    map.setView(
                                        userPosition,
                                        15
                                    );
                                }
                            );
                        } else {
                            alert(
                                "Geolocation is not available in this browser."
                            );
                        }
                    }
                );
        </script>

    </div>
</div>

</body>
</html>
