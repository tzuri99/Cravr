{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Map</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

</head>
<body>
    <h1>Restaurants</h1>

    <div class="map-legend">
        <span class="legend-green">● 4+ stars</span> ·
        <span class="legend-orange">● 3–4 stars</span> ·
        <span class="legend-red">● Below 3</span> ·
        <span class="legend-grey">● No reviews</span>
    </div>

    <button id="find-me" class="find-location-btn">Find my location</button>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script>
        const map = L.map("map").setView([3.14, 101.70], 13);

        L.tileLayer("https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png", {
            attribution: "© OpenStreetMap France | © OpenStreetMap contributors",
            maxZoom: 20,
        }).addTo(map);

        const markerCluster = L.markerClusterGroup();

        let userPosition = null;

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function (position) {
                userPosition = [position.coords.latitude, position.coords.longitude];
                map.setView(userPosition, 15);
                L.marker(userPosition)
                    .addTo(map)
                    .bindPopup("You are here")
                    .openPopup();
            });
        }

        function iconColorFor(rating) {
            if (rating === null || rating === undefined) return "grey";
            if (rating < 3) return "red";
            if (rating < 4) return "orange";
            return "green";
        }

        function coloredIcon(color) {
            return new L.Icon({
                iconUrl: "https://cdn.jsdelivr.net/gh/pointhi/leaflet-color-markers@master/img/marker-icon-2x-" + color + ".png",
                shadowUrl: "https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png",
                iconSize: [25, 41],
                iconAnchor: [12, 41],
                popupAnchor: [1, -34],
                shadowSize: [41, 41],
            });
        }

        const detailUrlBase = "{% url 'restaurant_detail' 0 %}".slice(0, -2);

        function loadRestaurants() {
            markerCluster.clearLayers();

            const bounds = map.getBounds();
            const url = "{% url 'restaurants_json' %}" +
                "?south=" + bounds.getSouth() +
                "&west=" + bounds.getWest() +
                "&north=" + bounds.getNorth() +
                "&east=" + bounds.getEast();

            fetch(url)
                .then(function (response) { return response.json(); })
                .then(function (restaurants) {
                    restaurants.forEach(function (r) {
                        const directionsUrl =
                            "https://www.google.com/maps/dir/?api=1&destination=" +
                            r.latitude + "," + r.longitude;

                        const ratingText = r.avg_rating
                            ? "★ " + r.avg_rating + " (" + r.review_count + " review" + (r.review_count === 1 ? "" : "s") + ")"
                            : "No reviews yet";

                        const popup =
                            "<strong>" + r.name + "</strong><br>" +
                            (r.cuisine || "") + "<br>" +
                            ratingText + "<br>" +
                            (r.address || "") + "<br>" +
                            '<a href="' + detailUrlBase + r.id + '/">See details</a>' +
                            '<br><a href="' + directionsUrl + '" target="_blank">Get directions</a>';

                        const icon = coloredIcon(iconColorFor(r.avg_rating));
                        const marker = L.marker([r.latitude, r.longitude], { icon: icon });
                        marker.bindPopup(popup);
                        markerCluster.addLayer(marker);
                    });

                    map.addLayer(markerCluster);
                });
        }

        loadRestaurants();
        map.on("moveend", loadRestaurants);

        document.getElementById("find-me").addEventListener("click", function () {
            if (userPosition) {
                map.setView(userPosition, 15);
            } else if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function (position) {
                    userPosition = [position.coords.latitude, position.coords.longitude];
                    L.marker(userPosition)
                        .addTo(map)
                        .bindPopup("You are here")
                        .openPopup();
                    map.setView(userPosition, 15);
                });
            } else {
                alert("Geolocation is not available in this browser.");
            }
        });
    </script>
</body>
</html>
