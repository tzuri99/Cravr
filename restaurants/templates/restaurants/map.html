<!DOCTYPE html>
<html>
<head>
    <title>Map</title>
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <style>
        #map { height: 90vh; }
        body { margin: 0; font-family: sans-serif; }
        h1 { padding: 8px 16px; margin: 0; }
    </style>
</head>
<body>
    <h1>Restaurants</h1>
    <div style="padding: 8px 16px; font-size: 14px; color: #555;">
        <span style="color: #4a4;">● 4+ stars</span> ·
        <span style="color: #d80;">● 3–4 stars</span> ·
        <span style="color: #c33;">● Below 3</span> ·
        <span style="color: #888;">● No reviews</span>
    </div>
    <button id="find-me" style="margin: 8px 16px; padding: 6px 12px;">Find my location</button>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map("map").setView([3.14, 101.70], 13);

        L.tileLayer("https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png", {
            attribution: "© OpenStreetMap France | © OpenStreetMap contributors",
            maxZoom: 20,
        }).addTo(map);

        let userPosition = null;

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function (position) {
                userPosition = [position.coords.latitude, position.coords.longitude];
                map.setView(userPosition, 15);
                L.marker(userPosition)
                    .addTo(map)
                    .bindPopup("You are here")
                    .openPopup();
            });
        }

        function iconColorFor(rating) {
            if (rating === null || rating === undefined) return "grey";
            if (rating < 3) return "red";
            if (rating < 4) return "orange";
            return "green";
        }

        function coloredIcon(color) {
            return new L.Icon({
                iconUrl: "https://cdn.jsdelivr.net/gh/pointhi/leaflet-color-markers@master/img/marker-icon-2x-" + color + ".png",
                shadowUrl: "https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png",
                iconSize: [25, 41],
                iconAnchor: [12, 41],
                popupAnchor: [1, -34],
                shadowSize: [41, 41],
            });
        }

        const detailUrlBase = "{% url 'restaurant_detail' 0 %}".slice(0, -2);

        fetch("{% url 'restaurants_json' %}")
            .then(function (response) { return response.json(); })
            .then(function (restaurants) {
                restaurants.forEach(function (r) {
                    const directionsUrl =
                        "https://www.google.com/maps/dir/?api=1&destination=" +
                        r.latitude + "," + r.longitude;

                    const ratingText = r.avg_rating
                        ? "★ " + r.avg_rating + " (" + r.review_count + " review" + (r.review_count === 1 ? "" : "s") + ")"
                        : "No reviews yet";

                    const popup =
                        "<strong>" + r.name + "</strong><br>" +
                        (r.cuisine || "") + "<br>" +
                        ratingText + "<br>" +
                        (r.address || "") + "<br>" +
                        '<a href="' + detailUrlBase + r.id + '/">See details</a>' +
                        '<br><a href="' + directionsUrl + '" target="_blank">Get directions</a>';

                    const icon = coloredIcon(iconColorFor(r.avg_rating));
                    L.marker([r.latitude, r.longitude], { icon: icon })
                        .addTo(map)
                        .bindPopup(popup);
                });
            });

        document.getElementById("find-me").addEventListener("click", function () {
            if (userPosition) {
                map.setView(userPosition, 15);
            } else if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function (position) {
                    userPosition = [position.coords.latitude, position.coords.longitude];
                    L.marker(userPosition)
                        .addTo(map)
                        .bindPopup("You are here")
                        .openPopup();
                    map.setView(userPosition, 15);
                });
            } else {
                alert("Geolocation is not available in this browser.");
            }
        });
    </script>
</body>
</html>
