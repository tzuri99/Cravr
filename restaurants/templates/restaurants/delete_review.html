<!DOCTYPE html>
<html>
<head>
    <title>Delete review</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <h1 class="delete-review-title">Delete this review?</h1>

    <div class="review-delete-card">
        <p><strong>{{ review.restaurant.name }}</strong></p>
        <p>{{ review.stars }} / 5</p>
        <p>{{ review.text|linebreaksbr }}</p>
    </div>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="delete-review-button">
            Yes, delete
        </button>
        <a href="{% url 'restaurant_detail' review.restaurant.pk %}" class="cancel-delete">
    </form>
</body>
</html>
