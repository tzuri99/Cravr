{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Cravr</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <nav class="navbar">
        <a href="{% url 'home' %}" class="brand">Cravr</a>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-card">
            <h1>Complete Sign Up</h1>
            <p class="auth-subtitle">You're almost there — just pick a username to finish setting up your Cravr account.</p>

            <form method="POST" class="auth-form">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="auth-submit">Sign Up</button>
            </form>
        </div>
    </div>

</body>
</html>
