{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cravr — Find What You're Craving</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <nav class="navbar">
        <a href="{% url 'home' %}" class="brand">Cravr</a>

        <input type="checkbox" id="nav-toggle" class="nav-toggle">
        <label for="nav-toggle" class="nav-toggle-label">&#9776;</label>

        <div class="nav-links">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'search_users' %}">Search</a>
            <a href="{% url 'profile' %}">Profile</a>
            <a href="{% url 'logout' %}" class="nav-cta">Logout</a>
        </div>
    </nav>

    <section class="hero">
        <h1>Find your next <span class="highlight">craving</span>, fast.</h1>
        <p>Tell us what you're in the mood for, and Cravr finds the nearest places serving it — no more endless scrolling.</p>

        <div class="hero-actions">
            <a href="#" class="btn btn-primary">Start Exploring</a>
            <a href="#" class="btn btn-secondary">My Profile</a>
        </div>
    </section>

</body>
</html>
