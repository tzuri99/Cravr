{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cravr</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
 
    <nav class="navbar">
        <a href="{% url 'home' %}" class="brand">Cravr</a>
    </nav>
 
    <div class="auth-wrapper">
        <div class="auth-card">
            <h1>Welcome Back</h1>
            <p class="auth-subtitle">Login to continue exploring Cravr</p>
 
            {% if error %}
                <div class="auth-error">{{ error }}</div>
            {% endif %}
 
            <form method="POST" class="auth-form">
                {% csrf_token %}
                {{ form.as_p }}

                <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-top: -8px;">
                    <input type="checkbox" name="remember_me">
                    Remember me
                </label>

                <button type="submit" class="auth-submit">Login</button>
            </form>
 
            <div class="auth-links">
                <a href="{% url 'password_reset' %}">Forgot password?</a>
                <a href="{% url 'register' %}">Don't have an account? Sign up</a>
            </div>
        </div>
    </div>
</body>
</html>
