<!DOCTYPE html>
<html>
<head>
    <title>Login - Cravr</title>
</head>
<body>
    <h2>Login</h2>

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Login</button>
    </form>

    <p><a href="{% url 'password_reset' %}">Forgot password?</a></p>
    <p>Don't have an account? <a href="{% url 'register' %}">Sign up</a></p>
</body>
</html>
