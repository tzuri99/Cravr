{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - Cravr</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <nav class="navbar">
        <a href="{% url 'home' %}" class="brand">Cravr</a>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-card">
            <h1>Verify Your Email</h1>
            <p class="auth-subtitle">Enter the 6-digit code sent to your email</p>

            {% if error %}
                <div class="auth-error">{{ error }}</div>
            {% endif %}

            {% if success %}
                <div class="auth-success">{{ success }}</div>
            {% endif %}

            <form method="POST" action="{% url 'verify_otp' %}" class="auth-form">
                {% csrf_token %}
                <p>
                    <label for="otp_code">Verification Code</label>
                    <input type="text" name="otp_code" id="otp_code" maxlength="6" placeholder="Enter 6-digit code" required>
                </p>
                <button type="submit" class="auth-submit">Verify</button>
            </form>

            <div class="auth-links">
                <a href="{% url 'resend_otp' %}">Didn't receive a code? Resend</a>
            </div>
        </div>
    </div>

</body>
</html>
