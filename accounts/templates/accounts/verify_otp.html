<!DOCTYPE html>
<html>
<head>
    <title>Verify OTP - Cravr</title>
</head>
<body>
    <h2>Enter Verification Code</h2>
    <p>Check your terminal for the OTP code (email sending not set up yet).</p>
    
    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}
    
    <form method="POST">
        {% csrf_token %}
        <input type="text" name="otp_code" maxlength="6" placeholder="Enter 6-digit code" required>
        <button type="submit">Verify</button>
    </form>
</body>
</html>
