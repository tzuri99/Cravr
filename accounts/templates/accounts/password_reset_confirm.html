<!DOCTYPE html>
<html>
<head><title>Set New Password - Cravr</title></head>
<body>
    <h2>Set a New Password</h2>
    {% if validlink %}
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Change Password</button>
        </form>
    {% else %}
        <p>This password reset link is invalid or has expired.</p>
    {% endif %}
</body>
</html>
