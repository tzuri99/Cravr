{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - Cravr</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <nav class="navbar">
        <a href="{% url 'home' %}" class="brand">Cravr</a>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-card">
            <h1>Set New Password</h1>
            <p class="auth-subtitle">Enter your new password below</p>

            {% if validlink %}
                <form method="POST" class="auth-form">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="auth-submit">Change Password</button>
                </form>
            {% else %}
                <div class="auth-error">This password reset link is invalid or has expired.</div>
            {% endif %}
        </div>
    </div>

</body>
</html>
